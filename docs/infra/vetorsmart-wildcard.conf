# VetorSmart: sites das empresas em *.vetorsmart.com.br (WILDCARD-01.1). PREPARADO, NÃO APLICADO.
#
# Acrescentar ao final de nginx/conf.d/apps.conf da infraestrutura somente depois que:
#   1. /etc/letsencrypt/live/vetorsmart-wildcard/ existir (certificado curinga emitido e válido);
#   2. `docker compose exec nginx nginx -t` passar com este bloco;
#   3. houver autorização explícita para o reload.
#
# Nomes exatos têm prioridade sobre curingas no Nginx: os blocos atuais de vetorsmart.com.br e www.vetorsmart.com.br
# (certificado e redirecionamento do www) continuam valendo, e nenhum outro sistema usa *.vetorsmart.com.br.
# A mesma aplicação (container vetorsmart:9000) atende todos os hosts; a aplicação decide o que cada um serve
# (TrustedHosts recusa hosts desconhecidos, SiteHostGuard mantém o painel só no domínio principal).
#
# Rollback: remover os dois blocos abaixo, `nginx -t`, `nginx -s reload`. O certificado de vetorsmart.com.br
# nunca é substituído.

server {
    listen 80;
    server_name *.vetorsmart.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name *.vetorsmart.com.br;
    root /var/www/vetorsmart/public;
    ssl_certificate /etc/letsencrypt/live/vetorsmart-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetorsmart-wildcard/privkey.pem;
    include /etc/nginx/conf.d/laravel.inc;
    location /build/ { alias /var/www/vetorsmart/build/; try_files $uri =404; }
    location /storage/ { alias /var/www/vetorsmart/storage/; try_files $uri =404; }
    location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name; fastcgi_connect_timeout 2s; set $php_upstream vetorsmart:9000; fastcgi_pass $php_upstream; }
}
